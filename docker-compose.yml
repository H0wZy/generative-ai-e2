services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genai_e2
      POSTGRES_USER: genai_e2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genai_e2_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_e2 -d genai_e2"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://genai_e2:${POSTGRES_PASSWORD:-genai_e2_dev}@postgres:5432/genai_e2
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

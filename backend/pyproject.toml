[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-e2-backend"
version = "0.1.0"
description = "MVP da automacao Freshservice para Jira do Bootcamp Gen AI E2"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=4.0,<6.0",
  "python-multipart>=0.0.9,<1.0",
  "sentence-transformers>=3.0,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "respx>=0.21,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
